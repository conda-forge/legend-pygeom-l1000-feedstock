schema_version: 1

context:
  name: legend-pygeom-l1000
  version: "0.4.0"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/legend_pygeom_l1000-${{ version }}.tar.gz
  sha256: 8199420e4f596c57c63e98514672ad9d166cb26cd2656a1c4d844a54163cf07f

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
  python:
    entry_points:
      - legend-pygeom-l1000 = pygeoml1000.cli:dump_gdml_cli

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=77
    - setuptools-scm >=7
    - pip
  run:
    - python >=${{ python_min }}
    - legend-pygeom-hpges >=0.9.0
    - legend-pygeom-optics >=0.15
    - legend-pygeom-tools >=0.0.25
    - numpy
    - pint
    - pyg4ometry
    - dbetto
    - pylegendmeta >=1.3.1
    - pyyaml
    - scipy
    - git

tests:
  - python:
      imports:
        - l1000geom
        - pygeoml1000
      pip_check: true
      python_version: ${{ python_min }}
  - script:
      - legend-pygeom-l1000 dummy.gdml

about:
  summary: Geometry model of the LEGEND-1000 experimental setup
  license: GPL-3.0-only
  license_file: LICENSE
  homepage: https://github.com/legend-exp/legend-pygeom-l1000
  repository: https://github.com/legend-exp/legend-pygeom-l1000
  documentation: https://legend-pygeom-l1000.readthedocs.io

extra:
  recipe-maintainers:
    - gipert
    - ManuelHu
